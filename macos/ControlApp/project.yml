name: LoopKit-ControlApp
options:
  minimumXcodeGenVersion: 2.45.0
  projectFormat: xcode15_3
  deploymentTarget:
    macOS: "14.2"
packages:
  LoopKit:
    path: ../..
targets:
  LoopKitAgent:
    type: tool
    platform: macOS
    sources:
      - path: ../Daemon/Sources
    settings:
      PRODUCT_NAME: loopkitd
      PRODUCT_BUNDLE_IDENTIFIER: com.twoplustwoone.LoopKit.agent
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.10
      SWIFT_OBJC_INTEROP_MODE: objcxx
      CODE_SIGN_IDENTITY: "-"
      CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      INFOPLIST_FILE: ../Daemon/Info.plist
    dependencies:
      - package: LoopKit
        product: LoopKitDaemonCore
      - package: LoopKit
        product: LoopKitIPC
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
  LoopKitAudioService:
    type: xpc-service
    platform: macOS
    sources:
      - path: ../Daemon/Sources
      - path: Resources/Assets.xcassets
    settings:
      PRODUCT_NAME: LoopKitAudioService
      PRODUCT_BUNDLE_IDENTIFIER: com.twoplustwoone.LoopKit.agent
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.10
      SWIFT_OBJC_INTEROP_MODE: objcxx
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_ENTITLEMENTS: ../Daemon/LoopKitAudio.entitlements
      INFOPLIST_FILE: ../Daemon/XPCService-Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LoopKit
        product: LoopKitDaemonCore
      - package: LoopKit
        product: LoopKitIPC
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
  ControlApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      PRODUCT_NAME: LoopKit
      PRODUCT_BUNDLE_IDENTIFIER: com.twoplustwoone.LoopKit
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: 5.10
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_ENTITLEMENTS: Resources/LoopKit.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: LoopKit
      INFOPLIST_KEY_LoopKitTeamIdentifier: $(DEVELOPMENT_TEAM)
      INFOPLIST_KEY_NSAudioCaptureUsageDescription: LoopKit captures audio only from applications you explicitly select.
      INFOPLIST_KEY_NSMicrophoneUsageDescription: LoopKit needs microphone access so it can mix your voice with captured app audio.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LoopKitAgent
      - target: LoopKitAudioService
        embed: true
      - package: LoopKit
        product: LoopKitIPC
      - package: LoopKit
        product: LoopKitUI
      - sdk: AVFoundation.framework
    postBuildScripts:
      - name: Embed LoopKit LaunchAgent
        script: |
          set -euo pipefail
          launch_agents="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          /bin/mkdir -p "${launch_agents}"
          /usr/bin/ditto "${SRCROOT}/Resources/com.twoplustwoone.LoopKit.agent.plist" "${launch_agents}/com.twoplustwoone.LoopKit.agent.plist"
        inputFiles:
          - $(SRCROOT)/Resources/com.twoplustwoone.LoopKit.agent.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.twoplustwoone.LoopKit.agent.plist
