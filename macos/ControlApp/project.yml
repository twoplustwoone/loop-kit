name: LoopKit-ControlApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.2"
packages:
  LoopKit:
    path: ../..
targets:
  ControlApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      PRODUCT_NAME: LoopKit
      PRODUCT_BUNDLE_IDENTIFIER: com.twoplustwoone.LoopKit
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: 5.10
      CODE_SIGN_IDENTITY: "-"
      INFOPLIST_KEY_CFBundleDisplayName: LoopKit
    dependencies:
      - package: LoopKit
        product: LoopKitIPC
      - package: LoopKit
        product: LoopKitUI
