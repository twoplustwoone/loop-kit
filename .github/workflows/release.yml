name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: loopkit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  community-dmg:
    name: Build and publish Community DMG
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and project version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" == "${GITHUB_SHA}" ]]
          version="${GITHUB_REF_NAME#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          project_version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' macos/ControlApp/project.yml | sort -u)"
          [[ "${version}" == "${project_version}" ]]

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build ad-hoc signed Community DMG
        shell: bash
        run: ./scripts/community_release.sh "${GITHUB_REF_NAME#v}"

      - name: Verify checksum
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c "LoopKit-${GITHUB_REF_NAME#v}-Community.dmg.sha256"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/LoopKit-${version}-Community.dmg" \
            "dist/LoopKit-${version}-Community.dmg.sha256" \
            --verify-tag \
            --generate-notes \
            --notes "Community build: ad-hoc signed and not notarized. On first launch, macOS requires System Settings → Privacy & Security → Open Anyway. Verify the SHA-256 checksum before opening." \
            --title "LoopKit ${version} Community"
